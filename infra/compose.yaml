services:
  postgres:
    image: postgres:16
    container_name: mockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mockflow
      POSTGRES_USER: mockflow
      POSTGRES_PASSWORD: mockflow_local_password
    ports:
      - '5432:5432'
    volumes:
      - mockflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mockflow -d mockflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mockflow_pgdata:
